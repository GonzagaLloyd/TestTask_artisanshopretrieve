<!-- Customer reviews -->
<section class="section reviews" aria-labelledby="reviews-title">
  <h2 class="section__title" id="reviews-title">Bewertungen unserer Kunden</h2>

  <!-- Review cards are rendered by assets/js/reviews.js from assets/data/reviews.js -->
  <div class="slider" role="group" aria-label="Kundenbewertungen" data-slider>
    <ul class="slider__track" data-slider-track data-reviews></ul>
    <button class="slider__control slider__control--prev" type="button" data-slider-prev aria-label="Vorherige Bewertungen">
      <svg class="icon"><use href="#icon-chevron-left"></use></svg>
    </button>
    <button class="slider__control slider__control--next" type="button" data-slider-next aria-label="Nächste Bewertungen">
      <svg class="icon"><use href="#icon-chevron-right"></use></svg>
    </button>
  </div>

  <ul class="review-badges">
    <li class="review-badge">
      <div class="review-badge__content">
        <img class="review-badge__logo" src="assets/images/badge-google.webp" alt="Google" width="30" height="30" loading="lazy">
        <div>
          <span class="review-badge__text">Bewertungen bei Google</span>
          <div class="review-badge__rating">
            <span class="review-badge__score">5</span>
            <span class="rating rating--sm" role="img" aria-label="5 von 5 Sternen"><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg></span>
          </div>
        </div>
      </div>
      <a class="btn btn--outline btn--block" href="https://maps.google.com/?cid=4425066406261600760" target="_blank" rel="noopener">295 Bewertungen bei Google</a>
    </li>
    <li class="review-badge">
      <div class="review-badge__content">
        <img class="review-badge__logo" src="assets/images/badge-trustpilot.webp" alt="Trustpilot" width="121" height="30" loading="lazy">
        <div>
          <span class="review-badge__text">Reviews 244 - Excellent</span>
          <div class="review-badge__rating">
            <span class="rating rating--sm" role="img" aria-label="4,8 von 5 Sternen"><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg></span>
            <span class="review-badge__score">4.8</span>
          </div>
        </div>
      </div>
      <a class="btn btn--outline btn--block" href="https://de.trustpilot.com/review/artisanshop.de" target="_blank" rel="noopener">244 Bewertungen bei Trustpilot</a>
    </li>
  </ul>
</section>
